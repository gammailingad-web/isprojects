<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ISPROJECTS Portal</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f3f5f8; color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(440px, calc(100% - 40px)); box-sizing: border-box;
      padding: 32px 24px; text-align: center; background: white;
      border: 1px solid #e5e7eb; border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,.07);
    }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { line-height: 1.5; color: #4b5563; overflow-wrap: anywhere; }
    #retry { display: none; margin-top: 12px; padding: 10px 16px;
      border: 0; border-radius: 8px; background: #1d4ed8; color: white;
      cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>ISPROJECTS Portal</h1>
    <p id="status" role="status" aria-live="polite">Reading the current portal address…</p>
    <button id="retry" type="button" onclick="openPortal()">Try again</button>
  </main>
  <script>
    // Public GitHub Raw URL containing the current portal addresses.
    const URL_FILE =
      "https://raw.githubusercontent.com/gammailingad-web/ISProjects-URL-Manager/main/isportal-url.txt";

    async function openPortal() {
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");
      retry.style.display = "none";
      status.textContent = "Reading the current portal address…";

      try {
        const response = await fetch(URL_FILE + "?launcher_cache=" + Date.now(), {
          cache: "no-store",
          redirect: "follow"
        });
        if (!response.ok) {
          throw new Error("GitHub returned HTTP " + response.status);
        }

        const fileText = await response.text();

        // Use ONLY the first line (ISProjects URL); ignore line 2 (COC Portal URL).
        const firstLine = (fileText.split(/\r?\n/)[0] || "").trim();
        const parsed = new URL(firstLine);

        if (
          parsed.protocol !== "https:" ||
          !(parsed.hostname === "trycloudflare.com" ||
            parsed.hostname.endsWith(".trycloudflare.com")) ||
          parsed.username || parsed.password
        ) {
          throw new Error("Line 1 must be a valid HTTPS trycloudflare.com URL.");
        }

        // Preserve this launcher's original queuing destination and branch code.
        window.location.replace(parsed.origin + "/queuing.html?branch=DM");
      } catch (error) {
        status.textContent =
          "Unable to read the first line of the GitHub URL file. Check that the repository is public " +
          "and line 1 of isportal-url.txt contains a valid ISProjects HTTPS trycloudflare.com URL.";
        retry.style.display = "inline-block";
        console.error("Could not read the GitHub URL file:", error);
      }
    }

    openPortal();
  </script>
</body>
</html>
